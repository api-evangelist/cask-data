name: Cask Data
description: 'Cask Data was the developer-tools company (originally Continuuity) behind CDAP,
  the Cask Data Application Platform — a 100% open source, integrated framework for building and
  running batch and real-time data-analytics applications and self-service ETL/ELT data pipelines
  on Hadoop, Spark, and the cloud. Google acquired Cask Data in 2018; CDAP now powers Google
  Cloud Data Fusion while continuing as an Apache 2.0 open source project (github.com/cdapio) with a
  versioned HTTP RESTful API rooted at /v3/namespaces, a Java client library and CLI, and a
  downloadable local Sandbox. Backed by Amplify Partners and Battery Ventures.'
